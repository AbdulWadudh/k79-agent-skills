name: Release fallback

on:
  push:
    branches:
      - 'k79-release-fallback/**'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and tag
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify the release tag exists
        shell: bash
        run: |
          git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null

      - name: Check whether the release already exists
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $tag already exists; nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $tag is missing; publishing from the fallback branch."
          fi

      - name: Publish from the generated release notes
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.version.outputs.tag }}"
          notes_file="release-notes/${tag}.md"
          test -f "$notes_file"
          gh release create "$tag" --verify-tag --title "k79-agent-skills ${tag}" --notes-file "$notes_file"

      - name: Delete the fallback branch
        if: always()
        run: |
          git push origin --delete "$GITHUB_REF_NAME" || true
