name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify tag matches VERSION
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $file_version" >&2
            exit 1
          fi

      - name: Validate skills
        run: bun run validate

      - name: Validate release notes
        run: bun run release-notes:check

      - name: Verify release notes and manifest
        shell: bash
        env:
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          test -f "release-notes/${GITHUB_REF_NAME}.md"
          test -f release-notes/.last-release.json
          TAG_VERSION="$tag_version" node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('release-notes/.last-release.json','utf8'));if(m.version!==process.env.TAG_VERSION){console.error('manifest version '+m.version+' does not match tag '+process.env.TAG_VERSION);process.exit(1)}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; nothing to do."
            exit 0
          fi
          notes_file="release-notes/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "k79-agent-skills ${GITHUB_REF_NAME}" --notes-file "$notes_file"
